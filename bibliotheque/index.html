<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bibliothèque des compétences · Lefebvre Dalloz Compétences</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="gl" aria-label="La bibliothèque en 3D"></canvas>
<div id="labels" class="labels"></div>

<header id="top" class="top" hidden>
  <div class="brand"><span class="wordmark">Lefebvre Dalloz<small>Compétences</small></span></div>
  <nav id="crumbs" class="crumbs" aria-label="Où suis-je ?"></nav>
  <div class="top-actions">
    <button id="btnFilter" class="pill">Mes rayons</button>
    <button id="btnJourney" class="pill pill-main">Mon parcours <span id="jCount" class="count" hidden>0</span></button>
  </div>
</header>

<button id="navPrev" class="arrow prev" aria-label="Précédent" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 7 12l8 8"/></svg></button>
<button id="navNext" class="arrow next" aria-label="Suivant" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 4 8 8-8 8"/></svg></button>

<section id="hallCard" class="dock hall-card" hidden>
  <div id="hallDots" class="dots" role="tablist" aria-label="Les rayons"></div>
  <p id="hcKicker" class="kicker"></p>
  <h2 id="hcTitle"></h2>
  <p id="hcMeta" class="meta"></p>
  <button id="hcEnter" class="btn btn-primary">Entrer dans le rayon</button>
</section>

<section id="rayonBar" class="dock rayon-bar" hidden>
  <button id="btnBack" class="btn btn-ghost">← Grande salle</button>
  <div id="stepper" class="stepper" role="tablist" aria-label="Les travées"></div>
</section>

<aside id="bookPanel" class="panel" hidden></aside>
<aside id="journey" class="drawer" hidden aria-label="Mon parcours"></aside>

<section id="gate" class="gate" aria-labelledby="gateTitle">
  <div class="gate-card">
    <div class="g-top"><span class="wordmark">Lefebvre Dalloz<small>Compétences</small></span></div>
    <h1 id="gateTitle">Bibliothèque des compétences</h1>
    <p id="gateLead" class="g-lead">Un rayon par domaine, une travée par thématique, un grand livre par formation. Choisissez vos rayons : les portes s'ouvrent.</p>

    <div class="g-step"><h2>Votre métier</h2><div id="personas" class="chips"></div></div>
    <div class="g-step"><h2>Un besoin précis ?</h2>
      <input id="needQ" class="input" type="search" placeholder="Paie, bail commercial, IA, document unique, prise de parole…" autocomplete="off" aria-label="Décrivez votre besoin">
      <ul id="needRes" class="need-res"></ul>
    </div>
    <div class="g-step"><h2>Vos rayons <span class="g-tools"><button id="selAll" class="link">tout ouvrir</button><button id="selNone" class="link">tout fermer</button></span></h2><div id="doms" class="doms"></div></div>

    <div class="g-foot">
      <button id="enter" class="btn btn-primary">Entrer</button>
      <button id="gateClose" class="btn btn-ghost" hidden>Fermer</button>
      <span id="gateSum" class="g-sum"></span>
    </div>
  </div>
</section>

<div id="hint" class="hint" aria-live="polite"></div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="veil" class="veil"></div>

<script src="vendor/three.min.js"></script>
<script src="data.js"></script>
<script src="textures.js"></script>
<script src="book.js"></script>
<script src="scene.js"></script>
<script src="app.js"></script>
</body>
</html>
